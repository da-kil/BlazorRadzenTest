# Application CD Pipeline - Deploy to AKS using Helm
# Deploys containerized applications to AKS clusters

trigger: none

parameters:
  - name: imageTag
    displayName: 'Image Tag (Build ID)'
    type: string

variables:
  azureServiceConnection: 'resourcemanagement-dev'
  imageRepository: 'beachbreak'
  kubernetesNamespace: 'beachbreak'
  imageTag: '${{ parameters.imageTag }}'

stages:
  - stage: DeployDev
    displayName: 'Deploy to Development'
    variables:
      - group: beachbreak-dev
    jobs:
      - deployment: DeployToAKS
        displayName: 'Deploy to Dev AKS'
        environment: 'beachbreak-dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: 'latest'

                - task: AzureCLI@2
                  displayName: 'Get AKS Credentials'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(AKS_RG) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      kubectl create namespace $(kubernetesNamespace) --dry-run=client -o yaml | kubectl apply -f -

                - task: HelmDeploy@0
                  displayName: 'Deploy CommandApi'
                  inputs:
                    connectionType: 'Azure Resource Manager'
                    azureSubscription: '$(azureServiceConnection)'
                    azureResourceGroup: '$(AKS_RG)'
                    kubernetesCluster: '$(AKS_CLUSTER)'
                    namespace: '$(kubernetesNamespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-commandapi'
                    releaseName: 'commandapi'
                    valueFile: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-commandapi/values-dev.yaml'
                    overrideValues: |
                      image.tag=$(imageTag)
                      image.repository=$(ACR_NAME).azurecr.io/$(imageRepository)/commandapi
                      serviceAccount.annotations."azure\.workload\.identity/client-id"=$(COMMANDAPI_IDENTITY_CLIENT_ID)
                      keyVault.tenantId=$(AZURE_TENANT_ID)
                    install: true
                    waitForExecution: true
                    arguments: '--timeout 10m --create-namespace'

                - task: HelmDeploy@0
                  displayName: 'Deploy QueryApi'
                  inputs:
                    connectionType: 'Azure Resource Manager'
                    azureSubscription: '$(azureServiceConnection)'
                    azureResourceGroup: '$(AKS_RG)'
                    kubernetesCluster: '$(AKS_CLUSTER)'
                    namespace: '$(kubernetesNamespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-queryapi'
                    releaseName: 'queryapi'
                    valueFile: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-queryapi/values-dev.yaml'
                    overrideValues: |
                      image.tag=$(imageTag)
                      image.repository=$(ACR_NAME).azurecr.io/$(imageRepository)/queryapi
                      serviceAccount.annotations."azure\.workload\.identity/client-id"=$(QUERYAPI_IDENTITY_CLIENT_ID)
                      keyVault.tenantId=$(AZURE_TENANT_ID)
                    install: true
                    waitForExecution: true

                - task: HelmDeploy@0
                  displayName: 'Deploy Frontend'
                  inputs:
                    connectionType: 'Azure Resource Manager'
                    azureSubscription: '$(azureServiceConnection)'
                    azureResourceGroup: '$(AKS_RG)'
                    kubernetesCluster: '$(AKS_CLUSTER)'
                    namespace: '$(kubernetesNamespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-frontend'
                    releaseName: 'frontend'
                    valueFile: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-frontend/values-dev.yaml'
                    overrideValues: |
                      image.tag=$(imageTag)
                      image.repository=$(ACR_NAME).azurecr.io/$(imageRepository)/frontend
                      serviceAccount.annotations."azure\.workload\.identity/client-id"=$(FRONTEND_IDENTITY_CLIENT_ID)
                      keyVault.tenantId=$(AZURE_TENANT_ID)
                    install: true
                    waitForExecution: true

                - task: AzureCLI@2
                  displayName: 'Check Deployment Status'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(AKS_RG) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      kubectl get pods,svc,ingress -n $(kubernetesNamespace)

  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: beachbreak-prod
    jobs:
      - deployment: DeployToProduction
        displayName: 'Deploy to Production AKS'
        environment: 'beachbreak-production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: 'latest'

                - task: AzureCLI@2
                  displayName: 'Get AKS Credentials'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(AKS_RG) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing

                - task: HelmDeploy@0
                  displayName: 'Deploy CommandApi (Production)'
                  inputs:
                    connectionType: 'Azure Resource Manager'
                    azureSubscription: '$(azureServiceConnection)'
                    azureResourceGroup: '$(AKS_RG)'
                    kubernetesCluster: '$(AKS_CLUSTER)'
                    namespace: '$(kubernetesNamespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-commandapi'
                    releaseName: 'commandapi'
                    valueFile: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-commandapi/values-production.yaml'
                    overrideValues: |
                      image.tag=$(imageTag)
                      image.repository=$(ACR_NAME).azurecr.io/$(imageRepository)/commandapi
                      serviceAccount.annotations."azure\.workload\.identity/client-id"=$(COMMANDAPI_IDENTITY_CLIENT_ID)
                      keyVault.tenantId=$(AZURE_TENANT_ID)
                    install: true
                    waitForExecution: true
                    arguments: '--timeout 15m --create-namespace'

                - task: HelmDeploy@0
                  displayName: 'Deploy QueryApi (Production)'
                  inputs:
                    connectionType: 'Azure Resource Manager'
                    azureSubscription: '$(azureServiceConnection)'
                    azureResourceGroup: '$(AKS_RG)'
                    kubernetesCluster: '$(AKS_CLUSTER)'
                    namespace: '$(kubernetesNamespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-queryapi'
                    releaseName: 'queryapi'
                    valueFile: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-queryapi/values-production.yaml'
                    overrideValues: |
                      image.tag=$(imageTag)
                      image.repository=$(ACR_NAME).azurecr.io/$(imageRepository)/queryapi
                      serviceAccount.annotations."azure\.workload\.identity/client-id"=$(QUERYAPI_IDENTITY_CLIENT_ID)
                      keyVault.tenantId=$(AZURE_TENANT_ID)
                    install: true
                    waitForExecution: true

                - task: HelmDeploy@0
                  displayName: 'Deploy Frontend (Production)'
                  inputs:
                    connectionType: 'Azure Resource Manager'
                    azureSubscription: '$(azureServiceConnection)'
                    azureResourceGroup: '$(AKS_RG)'
                    kubernetesCluster: '$(AKS_CLUSTER)'
                    namespace: '$(kubernetesNamespace)'
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-frontend'
                    releaseName: 'frontend'
                    valueFile: '$(Pipeline.Workspace)/s/helm/charts/beachbreak-frontend/values-production.yaml'
                    overrideValues: |
                      image.tag=$(imageTag)
                      image.repository=$(ACR_NAME).azurecr.io/$(imageRepository)/frontend
                      serviceAccount.annotations."azure\.workload\.identity/client-id"=$(FRONTEND_IDENTITY_CLIENT_ID)
                      keyVault.tenantId=$(AZURE_TENANT_ID)
                    install: true
                    waitForExecution: true

                - task: AzureCLI@2
                  displayName: 'Verify Production Deployment'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(AKS_RG) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      kubectl get pods,svc,ingress -n $(kubernetesNamespace) -o wide
