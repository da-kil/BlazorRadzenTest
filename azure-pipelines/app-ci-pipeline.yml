# Application CI Pipeline - Build and Push Container Images
# Builds .NET applications and pushes Docker images to ACR

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    exclude:
      - terraform/**
      - helm/**
      - azure-pipelines/**
      - '**/*.md'

pr:
  branches:
    include:
      - main
      - develop

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  dockerRegistryServiceConnection: 'resourcemanagement-dev'
  acrLoginServer: 'acrbasicbasiszrh001.azurecr.io'
  imageRepository: 'beachbreak'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildDotNet
        displayName: 'Build .NET Solution'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: $(dotnetVersion)
              includePreviewVersions: false

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: '**/*.sln'
              feedsToUse: 'select'

          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: '**/*Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger trx'
              publishTestResults: true

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Code Coverage'
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Agent.TempDirectory)/**/*.cobertura.xml'

  - stage: BuildAndPushImages
    displayName: 'Build and Push Docker Images'
    dependsOn: Build
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/develop')))
    jobs:
      - job: BuildCommandApi
        displayName: 'Build and Push CommandApi Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build, Scan and Push CommandApi Image'
            inputs:
              azureSubscription: '$(dockerRegistryServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(acrLoginServer)
                docker build \
                  -t $(acrLoginServer)/$(imageRepository)/commandapi:$(tag) \
                  -t $(acrLoginServer)/$(imageRepository)/commandapi:latest \
                  -f 03_Infrastructure/ti8m.BeachBreak.CommandApi/Dockerfile \
                  .
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
                trivy image "$(acrLoginServer)/$(imageRepository)/commandapi:$(tag)" --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
                docker push $(acrLoginServer)/$(imageRepository)/commandapi:$(tag)
                docker push $(acrLoginServer)/$(imageRepository)/commandapi:latest

      - job: BuildQueryApi
        displayName: 'Build and Push QueryApi Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build, Scan and Push QueryApi Image'
            inputs:
              azureSubscription: '$(dockerRegistryServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(acrLoginServer)
                docker build \
                  -t $(acrLoginServer)/$(imageRepository)/queryapi:$(tag) \
                  -t $(acrLoginServer)/$(imageRepository)/queryapi:latest \
                  -f 03_Infrastructure/ti8m.BeachBreak.QueryApi/Dockerfile \
                  .
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
                trivy image "$(acrLoginServer)/$(imageRepository)/queryapi:$(tag)" --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
                docker push $(acrLoginServer)/$(imageRepository)/queryapi:$(tag)
                docker push $(acrLoginServer)/$(imageRepository)/queryapi:latest

      - job: BuildFrontend
        displayName: 'Build and Push Frontend Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build, Scan and Push Frontend Image'
            inputs:
              azureSubscription: '$(dockerRegistryServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(acrLoginServer)
                docker build \
                  -t $(acrLoginServer)/$(imageRepository)/frontend:$(tag) \
                  -t $(acrLoginServer)/$(imageRepository)/frontend:latest \
                  -f 05_Frontend/ti8m.BeachBreak/Dockerfile \
                  .
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
                trivy image "$(acrLoginServer)/$(imageRepository)/frontend:$(tag)" --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
                docker push $(acrLoginServer)/$(imageRepository)/frontend:$(tag)
                docker push $(acrLoginServer)/$(imageRepository)/frontend:latest

      - job: PublishBuildInfo
        displayName: 'Publish Build Information'
        dependsOn:
          - BuildCommandApi
          - BuildQueryApi
          - BuildFrontend
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Metadata'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'build-info'
              publishLocation: 'Container'

          - bash: |
              echo "Build ID: $(Build.BuildId)" > $(Build.ArtifactStagingDirectory)/build-info.txt
              echo "Source Branch: $(Build.SourceBranch)" >> $(Build.ArtifactStagingDirectory)/build-info.txt
              echo "Commit: $(Build.SourceVersion)" >> $(Build.ArtifactStagingDirectory)/build-info.txt
              echo "Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $(Build.ArtifactStagingDirectory)/build-info.txt
            displayName: 'Generate Build Info'
