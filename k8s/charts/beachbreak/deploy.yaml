# Source: beachbreak/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beachbreak
  namespace: beachbreak
  labels:
    helm.sh/chart: beachbreak-1.0.0
    app.kubernetes.io/name: beachbreak
    app.kubernetes.io/instance: beachbreak
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: beachbreak
      app.kubernetes.io/instance: beachbreak

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from ingress controller
    -
      from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx

    # Allow inter-service communication within namespace
    - from:
      - namespaceSelector:
          matchLabels:
            name: default
      ports:
      - protocol: TCP
        port: 8080

  egress:
    # Allow DNS resolution
    - to: []
      ports:
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53

    # Allow outbound connections defined in values
    -
      ports:
      - port: 5432
        protocol: TCP
      - port: 53
        protocol: TCP
      - port: 53
        protocol: UDP
      to: []

    # Allow connection to database
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: postgresql
      ports:
      - protocol: TCP
        port: 5432

    # Allow HTTPS for external services (Azure AD, etc.)
    - to: []
      ports:
      - protocol: TCP
        port: 443
