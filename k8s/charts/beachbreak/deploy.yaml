# Source: beachbreak/charts/beachbreak-commandapi/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: beachbreak-beachbreak-commandapi
  namespace: beachbreak
  labels:
    helm.sh/chart: beachbreak-commandapi-1.0.0
    app.kubernetes.io/name: beachbreak-commandapi
    app.kubernetes.io/instance: beachbreak
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: command-api
    app.kubernetes.io/part-of: beachbreak
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beachbreak-beachbreak-commandapi
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      selectPolicy: Min
