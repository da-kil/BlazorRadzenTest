# =========================================
# ti8m BeachBreak - Main Configuration
# =========================================

global:
  # Container registry configuration
  imageRegistry: "acrbasicbasiszrh001.azurecr.io"
  imageRepository: ti8m-beach-break
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

  # Azure Active Directory Configuration
  azureAd:
#    instance: "https://login.microsoftonline.com/"
#    domain: "ti8mAD.onmicrosoft.com"
#    tenantId: "7b8885d2-e886-46bd-abbc-5ee3e666ffc3"
#    clientId: "56d28183-2e3e-4ba0-bb69-be863ace168a"

    instance: "https://login.microsoftonline.com/"
    domain: "ti8mAD.onmicrosoft.com"
    tenantId: "7b8885d2-e886-46bd-abbc-5ee3e666ffc3"
    clientId: "a837fbbd-3eff-4ae8-a130-7b7de582ded3"
    #clientSecret: "your-client-secret"
    audience: "api://a837fbbd-3eff-4ae8-a130-7b7de582ded3"
    scope: "access_as_user"

  # Database Configuration
  database:
    host: "pg-bbrea-xpe-dev-swn-01.postgres.database.azure.com"
    port: 5432
    name: "beachbreakdb"

  #Object ID that should be used to connect to the KV in order to read secrets
  csiDriver:
    userAssignedIdentityID: "15050a0b-41d2-4d14-b256-168fee11a9c3"
    keyVaultName: "kv-bbreak-xpe-dev-swn-01"

  # Service Discovery (replaces Aspire in K8s)
  serviceDiscovery:
    commandApiService: "beachbreak-commandapi"
    queryApiService: "beachbreak-queryapi"
    commandApiPort: 80
    queryApiPort: 80

  # Security Configuration
  security:
    nonRootUser: 10001
    fsGroup: 10001
    runAsNonRoot: true

  # Monitoring
  monitoring:
    enabled: true
    namespace: monitoring

# =========================================
# Command API Configuration
# =========================================
beachbreak-commandapi:
  enabled: true

  image:
    repository: ti8m-beach-break/backend-command
    tag: "1.0.0"
    pullPolicy: Always

  replicaCount: 1

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "500m"

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  ingress:
    enabled: false  # Controlled by main ingress

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  healthChecks:
    enabled: false #TODO
    livenessProbe:
      httpGet:
        path: /alive
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# =========================================
# Query API Configuration
# =========================================

beachbreak-queryapi:
  enabled: true

  image:
    repository: ti8m-beach-break/backend-query
    tag: "1.0.0"
    pullPolicy: Always

  replicaCount: 1

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "1"

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  ingress:
    enabled: false  # Controlled by main ingress

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  healthChecks:
    enabled: false # TODO
    livenessProbe:
      httpGet:
        path: /alive
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# =========================================
# Frontend Configuration
# =========================================

beachbreak-frontend:
  enabled: true

  image:
    repository: ti8m-beach-break/frontend
    tag: "1.0.0"
    pullPolicy: Always

  replicaCount: 1

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  ingress:
    enabled: false  # Controlled by main ingress

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70

  healthChecks:
    enabled: false #TODO
    livenessProbe:
      httpGet:
        path: /alive
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# =========================================
# Ingress Configuration (Main Entry Point)
# =========================================

ingress:
  enabled: true
  className: "azure-application-gateway"

  annotations:
    ingressClassName: azure-application-gateway
    cert-manager.io/cluster-issuer: "letsencrypt-staging"

  hosts:
    - host: beachbreak.report.ti8m.ch
      paths:
        - path: /
          pathType: Prefix
          backend:
            service: beachbreak-frontend
            port: 80
        - path: /css
          pathType: Prefix
          backend:
            service: beachbreak-frontend
            port: 80
        - path: /c/api/v
          pathType: Prefix
          backend:
            service: beachbreak-commandapi
            port: 80
  tls:
    - secretName: beachbreak-tls
      hosts:
        - beachbreak.report.ti8m.ch

# =========================================
# Security & RBAC Configuration
# =========================================

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  rules: []

podSecurityPolicy:
  enabled: false

#networkPolicy:


# =========================================
# Monitoring & Observability
# =========================================

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s
  path: /metrics
  labels:
    app: beachbreak

prometheusRule:
  enabled: true
  namespace: monitoring
  rules:
    - alert: BeachBreakHighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate detected"

grafanaDashboard:
  enabled: true
  namespace: monitoring

# =========================================
# Additional Configuration
# =========================================

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Node affinity (optional)
nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""